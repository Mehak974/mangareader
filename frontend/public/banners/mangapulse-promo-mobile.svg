<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradMob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a071b"/>
      <stop offset="45%" stop-color="#140c34"/>
      <stop offset="100%" stop-color="#090a18"/>
    </linearGradient>

    <linearGradient id="accentMob" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="btnGradMob" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <radialGradient id="glowMob" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a071b" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadowMob" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#7c3aed" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .f-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .f-sub { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
    .f-btn { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .f-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background Base -->
  <rect width="600" height="160" fill="url(#bgGradMob)"/>
  <rect width="600" height="160" fill="url(#glowMob)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
  </g>

  <!-- Sparkles -->
  <circle cx="540" cy="24" r="1.5" fill="#38bdf8" opacity="0.8"/>
  <circle cx="560" cy="50" r="1.2" fill="#c084fc" opacity="0.8"/>
  <circle cx="40" cy="140" r="1.5" fill="#e879f9" opacity="0.6"/>

  <!-- Left Icon Mini -->
  <g transform="translate(24, 18)">
    <!-- Tag badge -->
    <rect width="144" height="20" rx="10" fill="#a855f7" fill-opacity="0.25" stroke="#c084fc" stroke-width="0.8"/>
    <circle cx="10" cy="10" r="3.5" fill="#22c55e"/>
    <text x="20" y="14" fill="#f3e8ff" font-size="9.5" class="f-mono" font-weight="700">NEVER LOSE PROGRESS</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(24, 46)">
    <text x="0" y="22" class="f-title" font-size="19" fill="#ffffff" letter-spacing="-0.3">
      Progress gone with manga site?
    </text>

    <!-- Subtitle -->
    <text x="0" y="44" class="f-sub" font-size="12.5" fill="#cbd5e1">
      Track &amp; backup your reading safely on <tspan fill="#38bdf8" font-weight="700">MangaPulse.co</tspan>
    </text>
  </g>

  <!-- Bottom CTA Row -->
  <g transform="translate(24, 104)">
    <!-- CTA Button -->
    <rect width="210" height="38" rx="19" fill="url(#btnGradMob)" stroke="#c084fc" stroke-width="1.2" filter="url(#shadowMob)"/>
    <text x="94" y="24" text-anchor="middle" fill="#ffffff" font-size="13" class="f-btn" letter-spacing="0.2">
      TRACK FREE NOW
    </text>
    <g transform="translate(170, 11)">
      <circle cx="8" cy="8" r="9" fill="#ffffff" fill-opacity="0.2"/>
      <path d="M6 8 L10 8 M8 6 L10 8 L8 10" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Micro text next to CTA -->
    <text x="230" y="24" fill="#94a3b8" font-size="11" class="f-sub">
      ⚡ 1-Click Sync • 100% Free
    </text>
  </g>

  <!-- Border Gradient Stroke -->
  <rect x="0.5" y="0.5" width="599" height="159" fill="none" stroke="url(#accentMob)" stroke-opacity="0.3" stroke-width="1"/>
</svg>
