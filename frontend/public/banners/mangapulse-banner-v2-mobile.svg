<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 90" width="100%" height="100%">
  <style>
    .b-brand { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .b-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .b-sub { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
    .b-btn { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
  </style>

  <!-- Solid Flat Background (MangaPulse Theme) -->
  <rect width="600" height="90" fill="#0c0e12"/>
  <rect x="5" y="5" width="590" height="80" rx="8" fill="#141b26" stroke="#242f42" stroke-width="1"/>

  <!-- Left: MP Square Badge -->
  <g transform="translate(16, 18)">
    <rect width="28" height="28" rx="6" fill="#ffffff"/>
    <text x="14" y="19" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#0c0e12">MP</text>
    <text x="36" y="19" class="b-brand" font-size="13" fill="#ffffff">MANGAPULSE</text>
  </g>

  <!-- Middle Text -->
  <g transform="translate(16, 52)">
    <text x="0" y="13" class="b-title" font-size="13.5" fill="#f8fafc">
      Progress gone with manga site?
    </text>
    <text x="0" y="27" class="b-sub" font-size="11" fill="#94a3b8">
      Track safely on <tspan fill="#3b82f6" font-weight="700">MangaPulse.co</tspan>
    </text>
  </g>

  <!-- Right: CTA Button -->
  <g transform="translate(435, 27)">
    <rect width="115" height="34" rx="6" fill="#2563eb"/>
    <text x="57" y="22" text-anchor="middle" class="b-btn" font-size="12" fill="#ffffff">
      Track Free &#8594;
    </text>
  </g>
</svg>
