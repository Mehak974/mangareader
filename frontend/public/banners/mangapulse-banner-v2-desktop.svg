<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" height="100%">
  <style>
    .brand-title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .main-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
    .sub-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; }
    .btn-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
  </style>

  <!-- Solid Flat Background (MangaPulse Theme: #0c0e12 / #141b26) -->
  <rect width="1200" height="80" fill="#0c0e12"/>
  <rect x="8" y="6" width="1184" height="68" rx="8" fill="#141b26" stroke="#242f42" stroke-width="1"/>

  <!-- Left: MangaPulse Official Brand Icon & Label -->
  <g transform="translate(26, 22)">
    <!-- MP Solid White Square Badge -->
    <rect width="36" height="36" rx="8" fill="#ffffff"/>
    <text x="18" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="16" fill="#0c0e12" letter-spacing="-0.5">MP</text>

    <!-- MANGAPULSE Brand Text -->
    <text x="46" y="24" class="brand-title" font-size="16" fill="#ffffff" letter-spacing="0.2">MANGAPULSE</text>
  </g>

  <!-- Divider Line -->
  <line x1="220" y1="20" x2="220" y2="60" stroke="#242f42" stroke-width="1"/>

  <!-- Center Content: Headline & Subheading -->
  <g transform="translate(245, 0)">
    <!-- Hook Headline -->
    <text x="0" y="34" class="main-text" font-size="15" fill="#f8fafc">
      Progress gone with manga site?
    </text>

    <!-- Value Proposition -->
    <text x="0" y="55" class="sub-text" font-size="13" fill="#94a3b8">
      Don&apos;t worry — track &amp; backup your reading progress here on <tspan fill="#3b82f6" font-weight="700">MangaPulse.co</tspan>
    </text>
  </g>

  <!-- Right: Solid Blue CTA Button (MangaPulse Accent: #2563eb) -->
  <g transform="translate(930, 22)">
    <rect width="175" height="36" rx="6" fill="#2563eb"/>
    <text x="87" y="23" text-anchor="middle" class="btn-text" font-size="13" fill="#ffffff" letter-spacing="0.2">
      Track Progress &#8594;
    </text>
  </g>
</svg>
