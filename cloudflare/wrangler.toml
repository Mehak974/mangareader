# wrangler.toml — KV-Free Edition
# KV namespace is no longer required for caching.
# Only add it back if you need persistent storage (user data, etc.)

name               = "mangareader-proxy"
main               = "worker.js"
compatibility_date = "2024-01-15"
workers_dev        = true

# ── Smart Placement ────────────────────────────────────────────────────────────
# Enable in the Cloudflare dashboard → Workers → your worker → Settings →
# Placement → Smart. Runs the Worker in the data center closest to your origin
# (Railway) rather than closest to the user, reducing cache-miss round-trip time.
# Free, takes 2 minutes, no config here.

# ── Custom domain ─────────────────────────────────────────────────────────────
# cdn.mangareader.pro is the host the frontends should use as
# NEXT_PUBLIC_WORKER_URL: a zone-backed hostname with a managed certificate, no
# workers.dev branding, and zone-level WAF / rate-limiting rules attachable to
# it. Cloudflare creates the DNS record and certificate automatically.
#
# NOTE on the original justification: it claimed the edge cache does not work on
# *.workers.dev, so every image view there becomes an R2 read. Measured on
# 2026-10-02 that was NOT the case — a second request returned X-Cache: HIT on
# both workers.dev and this domain, because caches.default is scoped per data
# center and is indifferent to the hostname. The migration is still worth doing
# for the hostname and WAF reasons above, but not for a cache win. Verify your
# own numbers before treating it as one.
#
# The api.* routes were REMOVED. They were attached but inert: api.mangareader.pro
# resolves to the Railway backend (Server: railway-hikari), and a request to
# /img-proxy there returns 404, not the Worker's 400 "Missing ?url=", so the
# Worker never saw that traffic. Leaving them attached was a live hazard — if
# DNS ever moved onto this zone, all backend traffic would hit the Worker and
# 404. The backend is reached over BACKEND_URL instead.
#
# workers_dev stays true until all three frontends are redeployed with the cdn
# URL; then set it false to close the old address.
routes = [
  { pattern = "cdn.mangareader.pro", custom_domain = true },
]

# ── R2 image store ────────────────────────────────────────────────────────────
# 1) npx wrangler r2 bucket create mangareader-images
# 2) Dashboard → R2 → mangareader-images → Settings → Object lifecycle rules:
#    expire prefix "img/" after 14 days (keeps you inside the 10GB free tier).
# 3) Optional purge endpoint:  npx wrangler secret put ADMIN_TOKEN
[[r2_buckets]]
binding     = "IMG_BUCKET"
bucket_name = "mangareader-images"

# WebP conversion before caching. Billed as Cloudflare Images "unique
# transformations": first 5,000/month free, then $0.50 per 1,000. Already-WebP
# images are skipped. Remove this block (or set WEBP_CONVERT = "off") to disable.
[images]
binding = "IMAGES"

# Backend fallback, used for both images and AniList.
#
# AniList is REQUIRED here, not optional: it blocks Cloudflare's shared egress
# IPs and answers {"errors":[{"status":403,"message":"You have been manually
# blocked..."}]}. Cloudflare cannot route around that, so the Worker relays via
# the Railway backend, whose IP is not blocked.
#
# Images use this too: the image CDNs throttle Cloudflare's IPs, and a different
# network path often succeeds where every Worker retry fails.
[vars]
BACKEND_URL = "https://api.mangareader.pro"

[observability.logs]
enabled = true
invocation_logs = true

# ── KV is REMOVED — caches.default handles everything for free ────────────────
# Old line was:
#   [[kv_namespaces]]
#   binding = "CACHE"
#   id      = "..."
# Delete it. Zero KV reads. Zero KV costs.

# ── Optional: add your custom domain ─────────────────────────────────────────
# routes = [{ pattern = "api.yourdomain.com/*", zone_name = "yourdomain.com" }]

# NOTE: wrangler envs do NOT inherit bindings, routes or observability, so every
# block from the top-level config is repeated below.
[env.production]
name          = "mangareader-proxy-prod"
compatibility_date = "2024-01-15"
workers_dev   = true

routes = [
  { pattern = "cdn.mangareader.pro", custom_domain = true },
]

[env.production.observability.logs]
enabled = true
invocation_logs = true

[env.production.images]
binding = "IMAGES"

[env.production.vars]
BACKEND_URL = "https://api.mangareader.pro"

[[env.production.r2_buckets]]
binding     = "IMG_BUCKET"
bucket_name = "mangareader-images"
