name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies (Frontend)
        working-directory: ./frontend
        run: npm ci

      - name: Lint (Frontend)
        working-directory: ./frontend
        run: npm run lint

      - name: Install dependencies (Backend)
        working-directory: ./backend
        run: npm ci

      # In a real environment, you'd start the backend and frontend servers
      # here, wait for them to be ready, and then run Cypress and k6 tests.
